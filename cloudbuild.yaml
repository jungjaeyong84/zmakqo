  # generator off, no ENTRY signals fire at all — operator-reported
  # symptom on 2026-04-29: "신호가 안 나오는 것 같다." Default-enabling
  # restores the only remaining entry path on every deploy and prevents
  # cloudbuild redeploys from silently turning entries off again.
  _DONBEOLJA_V2_SERVER_ENTRY_SIGNAL_GENERATOR_ENABLED: "1"
  # 2026-04-29 — emergency kill-switch on the OTHER server-native entry
