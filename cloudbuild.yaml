_STREAK_REQUIRE_FIRESTORE=$_DONBEOLJA_V2_EXIT_RUNTIME_CANARY_STREAK_REQUIRE_FIRESTORE DONBEOLJA_V2_SHADOW_EXIT_WRITE_ENABLED=$_DONBEOLJA_V2_SHADOW_EXIT_WRITE_ENABLED DONBEOLJA_V2_SHADOW_ALERT_DELIVERY_ENABLED=$_DONBEOLJA_V2_SHADOW_ALERT_DELIVERY_ENABLED V2_FIRESTORE_COST_GUARD_REQUIRE_BILLING_METRIC=$_V2_FIRESTORE_COST_GUARD_REQUIRE_BILLING_METRIC npm run run:v2-promotion-cloudbuild"]

