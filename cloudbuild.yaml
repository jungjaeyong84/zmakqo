  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/$_SERVICE:$_TAG"]

  # 2026-04-29 P0-1 — `donbeolja` is pinned to a single instance below
  # (--min-instances=1 --max-instances=1). The Binance user-data
  # WebSocket stream (src/services/binanceUserDataStream.js) uses a
  # Firestore-backed single-leader lease so only one instance opens
  # the WS connection. With max-instances>1, cron + tick_exit + signal
  # generator + webhook traffic was causing rapid scale-up that produced
  # lease ping-pong: LEASE_LOST → reconnect → new listenKey, every
  # 30–60 s. During each ping-pong window ORDER_TRADE_UPDATE /
  # ACCOUNT_UPDATE events from Binance dropped on the floor, which is
  # why operator-visible ENTRY/EXIT alerts fell behind by 3+ minutes.
  # The 5-min fixed cron cadence + 15-s tick_exit interval + webhook
  # trickle traffic is well within a single 2 GiB instance. If load
  # ever forces a re-evaluation, the correct answer is to extract the
  # WS streamer into its own always-on tiny service (NOT to raise
  # max-instances here) — lease ping-pong is an architectural fault
  # that horizontal scaling can't fix.
