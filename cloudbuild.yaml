  # run because active_position_n=25 saturated the default limit and
  # tripped the EXIT_RUNTIME_CANARY_ACTIVE_QUERY_LIMIT_REACHED blocker
  # (the canary fail-safes when the query maxes out, since it can't
  # tell whether there are unscanned position cycles past the limit).
  # 16 production markets × LONG/SHORT, plus stale ACTIVE_PROTECTED
  # cycles from prior deploy churn, can plausibly exceed 25 cycles.
  # Raising to 100 (the parsePositiveInt max) lets the cron see the
  # full universe; if we ever exceed 100 the blocker re-fires and we
  # know we have a real position-leak audit item.
