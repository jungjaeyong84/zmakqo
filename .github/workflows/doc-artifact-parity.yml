name: doc-artifact-parity

on:
  push:
  pull_request:

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Doc vs Artifact Parity
        run: npm run check:doc-artifact-parity
